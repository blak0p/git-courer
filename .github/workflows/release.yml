name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS archives
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build Darwin archives with Xcode
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CC="$(xcrun --find clang)" GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${GITHUB_REF_NAME}" -o git-courer ./cmd/main.go
          file git-courer | grep -q 'Mach-O.*x86_64'
          tar -czf "git-courer_${VERSION}_darwin_amd64.tar.gz" git-courer
          CC="$(xcrun --find clang)" GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${GITHUB_REF_NAME}" -o git-courer ./cmd/main.go
          file git-courer | grep -q 'Mach-O.*arm64'
          tar -czf "git-courer_${VERSION}_darwin_arm64.tar.gz" git-courer

      - uses: actions/upload-artifact@v4
        with:
          name: archive-darwin-amd64
          path: git-courer_*_darwin_amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: archive-darwin-arm64
          path: git-courer_*_darwin_arm64.tar.gz

  build-windows-amd64:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
          static: 0

      # FFI vendored as DLL + MinGW import library (.a) — no Rust compilation needed.
      # DLL is copied next to .exe and both uploaded so the binary works on Windows.

      - name: Build Binary
        shell: bash
        run: |
          set -euo pipefail
          go build -ldflags "-s -w -X github.com/blak0p/git-courer/internal/config.ServerVersion=${{ github.ref_name }}" -o git-courer-windows-amd64.exe ./cmd/main.go
          cp ffi/windows_amd64/ts_pack_core_ffi.dll ts_pack_core_ffi.dll

      - uses: actions/upload-artifact@v4
        with:
          name: binary-windows-amd64
          path: |
            git-courer-windows-amd64.exe
            ts_pack_core_ffi.dll

  release:
    name: Release
    needs:
      - build-macos
      - build-windows-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout does not fetch annotated tag metadata on tag
      # push triggers (bug #290). This explicit fetch ensures
      # goreleaser can use .TagSubject / .TagBody from annotated tags.
      - name: Fetch annotated tag metadata
        run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Goreleaser builds the Linux binary natively (CGO works on
      # ubuntu-latest). macOS and Windows binaries are built in
      # separate jobs above and uploaded after the release is created.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download native macOS archives
        uses: actions/download-artifact@v8
        with:
          path: native-binaries
          pattern: archive-darwin-*
          merge-multiple: true

      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          path: native-binaries
          pattern: binary-windows-amd64
          merge-multiple: true

      - name: Upload native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "native-binaries/git-courer_${VERSION}_darwin_amd64.tar.gz" \
            "native-binaries/git-courer_${VERSION}_darwin_arm64.tar.gz" \
            native-binaries/git-courer-windows-amd64.exe \
            native-binaries/ts_pack_core_ffi.dll \
            --clobber

      - name: Add native checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "git-courer_${VERSION}_linux_amd64.tar.gz" \
            --dir native-binaries \
            --clobber
          (
            cd native-binaries
            sha256sum \
              "git-courer_${VERSION}_linux_amd64.tar.gz" \
              "git-courer_${VERSION}_darwin_amd64.tar.gz" \
              "git-courer_${VERSION}_darwin_arm64.tar.gz" \
              git-courer-windows-amd64.exe \
              ts_pack_core_ffi.dll \
              > checksums.txt
          )
          gh release upload "${GITHUB_REF_NAME}" native-binaries/checksums.txt --clobber

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          AMD64_SHA="$(sha256sum "native-binaries/git-courer_${VERSION}_darwin_amd64.tar.gz" | awk '{print $1}')"
          ARM64_SHA="$(sha256sum "native-binaries/git-courer_${VERSION}_darwin_arm64.tar.gz" | awk '{print $1}')"
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "git-courer_${VERSION}_linux_amd64.tar.gz" \
            --dir native-binaries \
            --clobber
          LINUX_SHA="$(sha256sum "native-binaries/git-courer_${VERSION}_linux_amd64.tar.gz" | awk '{print $1}')"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/blak0p/homebrew-tap.git" homebrew-tap
          cat > homebrew-tap/Formula/git-courer.rb <<EOF
          class GitCourer < Formula
            desc "AI-powered local git operations via MCP. Zero cloud tokens for git."
            homepage "https://github.com/blak0p/git-courer"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/blak0p/git-courer/releases/download/v${VERSION}/git-courer_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${AMD64_SHA}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/blak0p/git-courer/releases/download/v${VERSION}/git-courer_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://github.com/blak0p/git-courer/releases/download/v${VERSION}/git-courer_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_SHA}"
              end
            end

            def install
              bin.install "git-courer"
            end

            test do
              system "#{bin}/git-courer", "--version"
            end
          end
          EOF

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-courer.rb
          if git diff --cached --quiet -- Formula/git-courer.rb; then
            echo "Homebrew formula is already current"
          else
            git commit -m "chore: update git-courer formula to v${VERSION}"
            git push
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
